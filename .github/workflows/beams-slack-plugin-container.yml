name: Beams Slack Plugin Container

on:
  push:
    branches:
      - main
    paths:
      - "beams-slack-plugin/**"
      - ".github/workflows/beams-slack-plugin-container.yml"
  pull_request:
    paths:
      - "beams-slack-plugin/**"
      - ".github/workflows/beams-slack-plugin-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: beams-slack-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/beams-slack-plugin
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: beams-slack-plugin
          file: beams-slack-plugin/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=beams-slack-plugin
          cache-to: type=gha,mode=max,scope=beams-slack-plugin
