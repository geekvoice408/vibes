name: eero Desktop (Swift)

on:
  push:
    paths:
      - "eero-desktop-swift/**"
      - ".github/workflows/eero-desktop-swift.yml"
  pull_request:
    paths:
      - "eero-desktop-swift/**"
      - ".github/workflows/eero-desktop-swift.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eero-desktop-swift-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: eero-desktop-swift

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package app
        run: Scripts/make-app.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: eero-desktop-app-${{ matrix.runner }}
          path: eero-desktop-swift/build/eero Desktop.app

  linux-core:
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build and test EeroCore
        run: swift build && swift test
