# Create the Slack app from this manifest: https://api.slack.com/apps ->
# Create New App -> From a manifest. Then upload assets/slack-beams-bot.png as
# the app icon, install the app, and create an app-level token with
# connections:write (see README).
display_information:
  name: Teleport Beams Bot
  description: Create and run Teleport Beams from Slack.
  background_color: "#3b2a9e"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Teleport Beams Bot
    always_online: true
  slash_commands:
    - command: /beams
      description: Create and run Teleport Beams
      usage_hint: help
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - commands
      - groups:history
      - im:history
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
